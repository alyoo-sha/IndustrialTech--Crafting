buildscript {
  repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
  }
  dependencies {
    classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
  }
}

plugins {
  id 'eclipse'
  id 'idea'
  id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
  id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
  archivesName = mod_id
}

java {
  toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
  mappings channel: mapping_channel, version: mapping_version

  copyIdeResources = true

  runs {
    configureEach {
      workingDirectory project.file('run')

      property 'forge.logging.markers', 'REGISTRIES'
      property 'forge.logging.console.level', 'debug'

      mods {
        "${mod_id}" {
          source sourceSets.main
        }
      }
    }

    client {
      property 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
      property 'forge.enabledGameTestNamespaces', mod_id
      args '--nogui'
    }

    gameTestServer {
      property 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
      workingDirectory project.file('run-data')

      args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
    }
  }
}

mixin {
  add sourceSets.main, "${mod_id}.refmap.json"

  config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
  // flatDir {
  //     dir 'libs'
  // }
  mavenLocal()
  mavenCentral()
  maven {
    url "https://cursemaven.com"
  }

  maven {
    name "Modmaven"
    url "https://modmaven.dev/"
    content {
      includeGroup 'appeng'
    }
  }
  maven { url 'https://maven.blakesmods.com' }
}

dependencies {
  minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

  runtimeOnly fg.deobf("curse.maven:sodium-embeddium-options-mod-compat-1146393:6929972")
  compileOnly fg.deobf("curse.maven:almostunified-633823:7430993")
  runtimeOnly fg.deobf("curse.maven:sodium-options-api-1103431:6100812")
  runtimeOnly fg.deobf("curse.maven:magnesium-extras-558905:6041697")
  runtimeOnly fg.deobf("curse.maven:dynamiclights-reforged-551736:6044481")
  runtimeOnly fg.deobf("curse.maven:mouse-tweaks-60089:5338457")
  runtimeOnly fg.deobf("curse.maven:ferritecore-429235:4810975")
  runtimeOnly fg.deobf("curse.maven:faster-block-placement-1025486:5374271")
  runtimeOnly fg.deobf("curse.maven:chunk-animator-embeddium-compat-1527419:8007459")
  runtimeOnly fg.deobf("curse.maven:chunk-animator-236484:4588407")
  runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
  runtimeOnly fg.deobf("curse.maven:applied-energistics-2-223794:7148487")//скачал
  runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")//скачал
  implementation fg.deobf("curse.maven:guideme-1173950:7127447")//скачал
  implementation fg.deobf("curse.maven:ldlib-626676:7809449") { transitive = false } //скачал
  implementation fg.deobf("curse.maven:emi-580555:8081375")//скачал
  implementation fg.deobf("curse.maven:crafttweaker-239197:7772873")//скачал
  implementation fg.deobf("curse.maven:botarium-704113:5486070")//скачал
  implementation fg.deobf("com.blakebr0.cucumber:Cucumber:1.20.1-7.0.16")
  implementation fg.deobf("appeng:appliedenergistics2-forge:15.4.8:api")

  // Example mod dependency using a mod jar from ./libs with a flat dir repository
  // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
  // The group id is ignored when searching -- in this case, it is "blank"
  // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

  // For more info:
  // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
  // http://www.gradle.org/docs/current/userguide/dependency_management.html

  annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}
tasks.named('processResources', ProcessResources).configure {
  var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                           forge_version       : forge_version, forge_version_range: forge_version_range,
                           loader_version_range: loader_version_range,
                           mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                           mod_authors         : mod_authors, mod_description: mod_description,]

  inputs.properties replaceProperties

  filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
    expand replaceProperties + [project: project]
  }
}

tasks.named('jar', Jar).configure {
  manifest {
    attributes(["Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
  }

  finalizedBy 'reobfJar'
}
tasks.register('jarNoObf', Jar) {
  archiveClassifier = 'noobf' // Добавит суффикс "-noobf" к имени файла
  from sourceSets.main.output // Берёт скомпилированные классы
  // Сюда можно добавить и ресурсы, если нужно
  from sourceSets.main.resources
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}
